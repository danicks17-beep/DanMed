<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DanMed Controls</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="danmed-popup">
  <div class="popup-header"><div><strong>DanMed Controls</strong><small>ModMed workflow tools</small></div><span class="version">5.0</span></div>
  <label class="popup-master"><span>Extension Enabled</span><input type="checkbox" id="masterEnable"><span class="popup-switch"></span></label>
  <p class="popup-help">Choose which DanMed features are active. Changes apply immediately to the open ModMed tab.</p>
  <section class="popup-section">
    <h2>Features</h2>
    <label class="popup-toggle"><span>Note Hover Previews</span><input type="checkbox" id="featureHover"><span class="popup-switch"></span></label>
    <label class="popup-toggle"><span>Task tools &amp; snoozing</span><input type="checkbox" id="featureTasks"><span class="popup-switch"></span></label>
    <label class="popup-toggle"><span>Appointment highlighting</span><input type="checkbox" id="featureAppointments"><span class="popup-switch"></span></label>
    <label class="popup-toggle"><span>OTC Add Charges sidebar</span><input type="checkbox" id="featureCharges"><span class="popup-switch"></span></label>
    <label class="popup-toggle"><span>Insurance payer shortcuts</span><input type="checkbox" id="featureInsurance"><span class="popup-switch"></span></label>
    <label class="popup-toggle"><span>Location shortcuts</span><input type="checkbox" id="featureLocation"><span class="popup-switch"></span></label>
    <label class="popup-toggle"><span>Staff &amp; provider shortcuts</span><input type="checkbox" id="featureStaff"><span class="popup-switch"></span></label>
    <label class="popup-toggle"><span>Fax/task label aliases</span><input type="checkbox" id="featureFaxLabels"><span class="popup-switch"></span></label>
    <label class="popup-toggle"><span>Self-pay charge override</span><input type="checkbox" id="featureSelfPay"><span class="popup-switch"></span></label>
  </section>
  <div id="status" class="popup-status" role="status"></div>
  <script src="popup.js"></script>
</body>
</html>
